name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Abrir a chave de assinatura
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          if [ -z "$ASSINATURA_SENHA" ]; then
            echo "::error::Falta o Secret ASSINATURA_SENHA (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in app/assinatura.jks.enc -out "$RUNNER_TEMP/chave.jks" -pass env:ASSINATURA_SENHA

      - name: Compilar versão final
        env:
          ASSINATURA_SENHA: ${{ secrets.ASSINATURA_SENHA }}
        run: |
          export ASSINATURA_ARQUIVO="$RUNNER_TEMP/chave.jks"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk RemedioDaHora.apk
          rm -f "$RUNNER_TEMP/chave.jks"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RemedioDaHora-apk
          path: RemedioDaHora.apk

      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          body: "Baixe o arquivo **RemedioDaHora.apk** abaixo e abra no celular para instalar."
          files: RemedioDaHora.apk
          make_latest: true
