name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RemedioDaHora.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RemedioDaHora-apk
          path: RemedioDaHora.apk

      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          body: "Baixe o arquivo **RemedioDaHora.apk** abaixo e abra no celular para instalar."
          files: RemedioDaHora.apk
          make_latest: true
